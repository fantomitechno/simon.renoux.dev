<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>simon.renoux.dev</title>

  <style>
    @font-face {
      font-family: 'Lexend Variable';
      src: url(fonts/lexend.ttf);
    }

    :root {
      --color-bg-0: rgb(40, 38, 36);
      --color-bg-1: rgb(92, 86, 81);
      --color-primary: #d06005;
      --color-secondary: #e2931d;
      --color-text: rgba(207, 207, 207, 0.9);
      --color-text-secondary: rgb(168, 53, 188);
      --color-text-quote: rgba(169, 167, 167, 0.9);

      font-family: 'Lexend Variable', 'Arial';
      color: var(--color-text);
    }


    body {
      background-color: var(--color-bg-0);
      margin: 0;
    }


    header {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      max-width: 64rem;
      margin: 0 auto;
      border: var(--color-bg-1) solid 2px;

      h1 {
        margin: 0;
        padding-left: 8px;
        height: 2rem;

        a {
          font-size: 2rem;
          color: var(--color-text);
          text-decoration: none;
        }

        a:hover {
          color: var(--color-text-secondary);
          transition: color 0.2s linear;
        }
      }

      nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        max-width: 50%;
        margin-right: calc(8px - 0.5rem);
        border-left: var(--color-bg-1) solid 2px;

        a {
          font-size: 1rem;
          color: var(--color-text);
          text-decoration: none;
          padding: 0.5rem 0.5rem;
        }

        a:hover {
          color: var(--color-secondary);
          transition: color 0.2s linear;
        }
      }
    }

    main {
      @media (min-width: 720px) {
        h1 {
          font-size: 1.4rem;
        }

        h2 {
          font-size: 1.2rem;
        }
      }


      h1 {
        font-size: 1rem;
        text-align: left;
        width: fit-content;
        background-image: linear-gradient(to right, var(--color-secondary), var(--color-secondary));
        background-position: 0 1.18em;
        background-repeat: repeat-x;
        display: inline-block;
        background-size: 100% 0.16em;
        padding-bottom: 0.16em;
      }

      h2 {
        font-size: 1rem;
        width: fit-content;
        background-image: linear-gradient(to right, var(--color-text-secondary), var(--color-text-secondary));
        background-position: 0 1.18em;
        background-repeat: repeat-x;
        display: inline-block;
        background-size: 100% 0.16em;
        padding-bottom: 0.16em;
      }

      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      width: 100%;
      max-width: 56rem;
      margin: 0 auto;
      box-sizing: border-box;


      a {
        font-size: 1rem;
        color: var(--color-text-secondary);
        text-decoration: none;
      }

      a:hover {
        color: var(--color-secondary);
        transition: color 0.2s linear;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>
      <a href="/">
        Simon R.
      </a>
    </h1>
    <nav>
      <a href="/">about</a>
      <a href="/gallery">oc gallery</a>
      <a href="/photo-gallery">photo gallery</a>
      <a href="/contact">contact</a>
    </nav>
  </header>

  <main>
    <h1>404</h1>
    <h2>This page does not exist...</h2>
    <p>
      I don't have much to say, you are just lost...
    </p>
    <p>
      You should get back <a href="/">home</a>
    </p>
  </main>
</body>

</html>
